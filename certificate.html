<!doctype html>
<html lang="en" data-base="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate of Orbital Registry</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/certificate.css">
</head>
<body>

<div class="toolbar">
  <span class="toolbar__hint" id="hint">Loading…</span>
  <label class="visually-hidden" for="t-name">New name</label>
  <input id="t-name" placeholder="New name for the rock" style="padding:.55rem .7rem;border:1px solid #1C567F;background:#0A2743;color:#E7F1FA;font:inherit;min-width:200px;">
  <label class="visually-hidden" for="t-for">Certificate is for</label>
  <input id="t-for" placeholder="Certificate is for…" style="padding:.55rem .7rem;border:1px solid #1C567F;background:#0A2743;color:#E7F1FA;font:inherit;min-width:180px;">
  <button type="button" id="copyjson">Copy registry entry</button>
  <button type="button" id="print" class="primary">Save as PDF</button>
</div>

<article class="sheet" id="sheet" aria-label="Certificate of Orbital Registry">
  <div class="sheet__inner" id="inner"></div>
</article>

<script src="./config.js"></script>
<script type="module" src="./js/certificate.js"></script>
</body>
</html>
